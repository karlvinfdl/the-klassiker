# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your bundle packages.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  uploads_directory: "%kernel.project_dir%/public/uploads"

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    public: false # Allows optimizing the container by removing unused services

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: "../src/"
    exclude:
      - "../src/Entity/"
      - "../src/DependencyInjection/"
      - "../src/Tests/"
      - "../src/Kernel.php"

  # Controllers must be registered as services to allow autowiring
  # You can define controllers as services here if you want to use custom configuration
  # App\Controller\:
  #     resource: '../src/Controller/'
  #     tags: ['controller.service_arguments']

  # Configuration du service d'email
  App\Service\EmailService:
    arguments:
      $senderEmail: "%env(MAILER_SENDER_EMAIL)%"
      $senderName: "%env(MAILER_SENDER_NAME)%"
      $adminEmail: "%env(ADMIN_EMAIL)%"

  # Repository services - required for Doctrine ServiceEntityRepository
  App\Repository\CategoryRepository:
    tags: ["doctrine.repository_service"]
    arguments: ["@doctrine"]

  App\Repository\ContactMessageRepository:
    tags: ["doctrine.repository_service"]
    arguments: ["@doctrine"]

  App\Repository\DishRepository:
    tags: ["doctrine.repository_service"]
    arguments: ["@doctrine"]

  App\Repository\GalleryPhotoRepository:
    tags: ["doctrine.repository_service"]
    arguments: ["@doctrine"]

  App\Repository\OpeningHoursRepository:
    tags: ["doctrine.repository_service"]
    arguments: ["@doctrine"]

  App\Repository\UserRepository:
    tags: ["doctrine.repository_service"]
    arguments: ["@doctrine"]
